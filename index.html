<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none">
    <meta name="description" content="WEX-TIER — лучший конструктор тир-листов. Создавай, делись и сравнивай тир-листы фильмов, игр, музыки и всего, что любишь.">
    <link rel="canonical" href="https://wexcar12.github.io/wextier/">
    <meta property="og:title" content="WEX-TIER — Создай свой тир-лист">
    <meta property="og:description" content="Лучший конструктор тир-листов в рунете. Фильмы, игры, музыка — перетаскивай и делись с друзьями.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wexcar12.github.io/wextier/">
    <meta property="og:image" content="https://wexcar12.github.io/wextier/og-image.svg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ru_RU">

    <meta name="twitter:title" content="WEX-TIER — Создай свой тир-лист">
    <meta name="twitter:description" content="Лучший конструктор тир-листов в рунете.">
    <meta name="twitter:image" content="https://wexcar12.github.io/wextier/og-image.svg">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"WEX-TIER","url":"https://wexcar12.github.io/wextier/","description":"Лучший конструктор тир-листов в рунете. Создавай, делись и сравнивай тир-листы фильмов, игр, музыки.","applicationCategory":"EntertainmentApplication","operatingSystem":"Web","inLanguage":"ru","offers":{"@type":"Offer","price":"0","priceCurrency":"RUB"}}</script>
    <title>WEX-TIER — Создай свой тир-лист</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@0.330.0/dist/umd/lucide.min.js" defer></script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<noscript><div style="text-align:center;padding:40px;color:#fff;background:#0a0a10;min-height:100vh;display:flex;align-items:center;justify-content:center;"><p>Для работы WEX-TIER необходим JavaScript</p></div></noscript>

    <div id="parallaxWrapper"><div id="parallaxLayer1" class="pz-layer"></div><div id="parallaxLayer2" class="pz-layer"></div><div id="parallaxLayer3" class="pz-layer"></div><img id="parallaxPhoto" class="pz-layer" alt=""><video id="parallaxVideo" class="pz-layer" muted loop autoplay playsinline></video></div>

    <header class="app-header" id="appHeader">
        <div class="header-left">
            <div class="header-logo">WEX-TIER</div>
        </div>

        <div class="header-center">
            <div class="header-dropdown-wrap">
                <button class="header-btn header-dropdown-trigger" id="templatesDropdownBtn" title="Шаблоны"><i data-lucide="layout-grid"></i> <span>Шаблоны</span> <i data-lucide="chevron-down" class="header-chevron"></i></button>
                <div class="header-dropdown" id="templatesDropdown">
                    <label class="sr-only" for="templateSelect">Выбор шаблона</label>
                    <select id="templateSelect" class="header-select" title="Выбор шаблона">
                        <option value="music">🎵 Музыкальные треки</option>
                        <option value="movies">🎬 Фильмы и Сериалы</option>
                        <option value="games">🎮 Компьютерные Игры</option>
                        <option value="actors">🎭 Популярные Актеры</option>
                        <option value="musicians">🎤 Музыканты</option>
                        <option value="athletes">🏅 Спортсмены</option>
                        <option value="bloggers">📹 Блогеры и стримеры</option>
                        <option value="anime">🎌 Аниме</option>
                    </select>
                    <div class="header-dropdown-divider"></div>
                    <button class="header-dropdown-item" id="openCommunityTemplatesBtn"><i data-lucide="globe"></i> Шаблоны сообщества</button>
                </div>
            </div>

            <div class="header-dropdown-wrap">
                <button class="header-btn header-dropdown-trigger" id="draftsDropdownBtn" title="Черновики"><i data-lucide="file-text"></i> <span>Черновики</span> <i data-lucide="chevron-down" class="header-chevron"></i></button>
                <div class="header-dropdown" id="draftsDropdown">
                    <div id="draftListDropdown"></div>
                    <div class="header-dropdown-divider"></div>
                    <button class="header-dropdown-item" id="newDraftBtnSidebar"><i data-lucide="plus"></i> Новый черновик</button>
                </div>
            </div>

            <div class="header-divider"></div>

            <button class="header-btn" id="shareBtn" title="Поделиться"><i data-lucide="link"></i></button>
            <button class="header-btn" id="pngBtn" title="Скачать PNG"><i data-lucide="download"></i></button>
            <button class="header-btn" id="galleryBtn" title="Галерея"><i data-lucide="image"></i></button>
        </div>

        <div class="header-right">
            <div class="header-dropdown-wrap">
                <button class="header-btn header-dropdown-trigger" id="moreDropdownBtn" title="Ещё"><i data-lucide="more-horizontal"></i></button>
                <div class="header-dropdown header-dropdown-right" id="moreDropdown">
                    <button class="header-dropdown-item" id="exportBtn"><i data-lucide="save"></i> Экспорт JSON</button>
                    <button class="header-dropdown-item" id="importBtn"><i data-lucide="folder-open"></i> Импорт JSON</button>
                    <label class="sr-only" for="importFile">Импорт файла</label><input type="file" id="importFile" accept=".json" style="display:none;">
                    <div class="header-dropdown-divider"></div>
                    <button class="header-dropdown-item" id="compareBtn"><i data-lucide="columns"></i> Сравнение</button>
                    <div class="header-dropdown-divider"></div>
                    <button class="header-dropdown-item" id="achievementsBtn"><i data-lucide="trophy"></i> Достижения</button>
                    <button class="header-dropdown-item" id="topBtn"><i data-lucide="medal"></i> Топ</button>
                    <button class="header-dropdown-item" id="commentsBtn"><i data-lucide="message-square"></i> Комментарии</button>
                    <button class="header-dropdown-item" id="profileDashboardBtn" style="display:none;"><i data-lucide="folder-open"></i> Мои тир-листы</button>
                </div>
            </div>

            <div class="header-divider"></div>

            <button class="header-btn" id="settingsBtn" title="Настройки"><i data-lucide="settings"></i></button>

            <div id="authSection" class="header-auth">
                <button id="loginBtn" class="header-btn header-btn-login" title="Войти"><i data-lucide="log-in"></i></button>
                <div id="userProfile" style="display:none;" class="header-user">
                    <img id="userAvatar" alt="Аватар" class="header-avatar">
                    <div class="header-dropdown header-dropdown-right header-user-dropdown" id="userDropdown">
                        <div id="userName" class="header-dropdown-name">Геймер</div>
                        <div class="header-dropdown-divider"></div>
                        <button class="header-dropdown-item" id="logoutLink"><i data-lucide="log-out"></i> Выйти</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <div id="foreignBanner" class="foreign-banner hidden">
            <i data-lucide="eye"></i>
            <span>Ты смотришь чужой тир-лист — изменения можно перетаскивать для интереса, но они никуда не сохранятся.</span>
        </div>
        <div class="top-bar" id="topBar">
            <label class="sr-only" for="searchInput">Поиск</label><input type="text" class="search-bar" id="searchInput" placeholder="🔎 Поиск по названию...">
        </div>
        <div class="compare-wrap" id="compareWrap">
            <div class="column" id="col1"><div id="list1"></div></div>
            <div class="column" id="col2" style="display:none;"><div id="list2"></div></div>
        </div>
        <div id="templatePoolContainer" class="top-bar" style="margin-top: 30px; max-width: 1200px; display: none; flex-direction: column; gap: 12px; width: 100%;">
            <div class="bs-handle" id="bsHandle"></div>
            <div style="font-size: 0.9rem; color: var(--gold); font-weight: 600;">📦 Доступные элементы шаблона (перетащите в нужный тир):</div>
            <div id="templatePool" class="tier-items" style="min-height: 80px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px dashed var(--input-border);"></div>
        </div>
        <button id="bsToggleBtn" aria-label="Показать пул элементов"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
    </main>

    <div class="modal" id="addModal"><div class="modal-box"><h3>Добавить трек</h3><label class="sr-only" for="svc">Сервис</label><select id="svc" data-enhance><option value="youtube">YouTube</option><option value="spotify">Spotify</option><option value="apple">Apple Music</option><option value="yandex">Яндекс Музыка</option></select><label class="sr-only" for="trackUrl">Ссылка на трек</label><input type="text" id="trackUrl" placeholder="Ссылка на трек"><button class="btn btn-secondary" id="fetchCoverBtn" style="width:100%;margin-bottom:6px;">Авто-поиск обложки</button><label class="sr-only" for="coverUrl">Ссылка на картинку</label><input type="text" id="coverUrl" placeholder="Ссылка на картинку"><img class="cover-preview" id="coverPreview" src="" alt="Превью" style="display:none;"><div class="modal-actions"><button class="btn btn-secondary" id="cancelAdd">Отмена</button><button class="btn btn-primary" id="okAdd">Добавить</button></div></div></div>
    <div class="modal" id="playerModal"><div class="modal-box" style="width:600px;"><h3>YouTube</h3><iframe class="player-frame" id="playerFrame" src="" allowfullscreen></iframe><div class="modal-actions"><button class="btn btn-secondary" id="closePlayer">Закрыть</button></div></div></div>

    <!-- ФИКС: сюда переехали "Тема / Неон / Параллакс / Стиль / Размер / Фон" из перегруженного
         сайдбара — открывается по кнопке-шестерёнке. Элементы настоящие (с теми же id), просто
         физически перемещаются сюда и обратно модальным менеджером — весь код на них продолжает
         работать без изменений. -->
    <div id="settingsPanel" style="display:none;">
        <h3 style="color:var(--gold);margin-bottom:12px;">Настройки</h3>
        <div class="bento-grid">
            <div class="bento-card">
                <div class="bento-card-title"><i data-lucide="palette"></i> Оформление</div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <button class="sidebar-btn" id="themeBtn" title="Сменить тему" style="flex:1;justify-content:center;"><i data-lucide="moon"></i> <span>Тема</span></button>
                </div>
                <div style="display:flex;gap:6px;">
                    <select id="styleSelect" class="sidebar-select" title="Стиль карточек" style="flex:1;"><option value="gradient">Градиент</option><option value="shadow">Тень</option><option value="border">Рамка</option><option value="circle">Круглые</option></select>
                    <select id="sizeSelect" class="sidebar-select" title="Размер карточек" style="flex:1;"><option value="60">Средние</option><option value="44">Мелкие</option><option value="76">Крупные</option></select>
                </div>
            </div>
            <div class="bento-card">
                <div class="bento-card-title"><i data-lucide="sparkles"></i> Фон и эффекты</div>
                <select id="bgSelect" class="sidebar-select" title="Фоновое изображение"><option value="0">🌌 Аврора</option><option value="1">🌅 Закат</option><option value="2">🌊 Океан</option><option value="3">💎 Изумруд</option><option value="4">🔮 Фиолет</option><option value="5">⚫ Графит</option></select>
                <div style="display:flex;gap:6px;">
                    <button class="sidebar-btn" id="neonBtn" title="Настройки неона" style="flex:1;justify-content:center;"><i data-lucide="lightbulb"></i> <span>Неон</span></button>
                    <button class="sidebar-btn" id="parallaxBtn" title="Эффект параллакса" style="flex:1;justify-content:center;"><i data-lucide="layers"></i> <span>Параллакс</span></button>
                </div>
                <select id="parallaxBgSelect" class="sidebar-select" title="Фон параллакса">
                  <option value="theme">🎨 Только тема</option>
                  <option value="favorite">⭐ Мой любимый</option>
                  <option value="mountains">🏔️ Горы</option>
                  <option value="forest">🌲 Лес</option>
                  <option value="space">🌌 Космос</option>
                  <option value="custom">🔗 Своя картинка/видео...</option>
                </select>
            </div>
        </div>
        <div class="modal-actions" style="margin-top:12px;">
            <button class="btn btn-secondary" id="closeSettingsPanel">Закрыть</button>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
